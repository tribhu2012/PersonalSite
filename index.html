<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Circular portrait crop from the hero illustration. The .ico is the
         fallback for clients that only ever request /favicon.ico. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffa98c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tribhuwan Bhatta</title>
    <!-- UConn sentence removed for now. Original tail of both descriptions:
         " Incoming MS in Business Analytics and Project Management at UConn, Fall 2026." -->
    <meta
      name="description"
      content="Project manager leading fintech product delivery across 12+ banking clients."
    />
    <!-- Share cards. og:image must be absolute — scrapers don't resolve
         relative paths. It's a screenshot of the hero; regenerate with
         `npm run og` after the home screen changes. -->
    <meta property="og:title" content="Tribhuwan Bhatta — Engineer & Project Manager" />
    <meta
      property="og:description"
      content="Project manager leading fintech product delivery across 12+ banking clients."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tribhuwan Bhatta" />
    <meta property="og:url" content="http://tribhuwanb.com.np/" />
    <!-- Served from the repo via jsDelivr, not from this domain. GitHub has
         the domain's certificate stuck in `dns_changed`, so nothing here is
         reachable over https, and scrapers refuse a plain-http image. Point
         both image tags back at /og-cover.jpg once https works. -->
    <meta
      property="og:image"
      content="https://cdn.jsdelivr.net/gh/tribhu2012/PersonalSite@main/public/og-cover.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tribhuwan Bhatta — Engineer & Project Manager" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tribhuwan Bhatta — Engineer & Project Manager" />
    <meta
      name="twitter:description"
      content="Project manager leading fintech product delivery across 12+ banking clients."
    />
    <meta
      name="twitter:image"
      content="https://cdn.jsdelivr.net/gh/tribhu2012/PersonalSite@main/public/og-cover.jpg"
    />

    <link rel="canonical" href="http://tribhuwanb.com.np/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
